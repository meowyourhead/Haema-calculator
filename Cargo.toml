[package]
name = "haematology_calculator"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Developer-only: HAEM_SHOT=<file.png> renders one frame to a PNG and exits.
screenshot = ["dep:image"]

[target.'cfg(windows)'.dependencies]
# Read the native window handle so the Genshin cursor override can hook WM_SETCURSOR.
raw-window-handle = "0.6"

[build-dependencies]
# Embeds the fox icon (and version strings) into the .exe on Windows.
winresource = "0.1"

[dev-dependencies]
# Used by examples/fontcheck.rs to validate the bundled TTFs.
ab_glyph = "0.2"

[profile.release]
opt-level = 3
# Whole-program optimisation: smaller, slightly faster exe (longer release builds).
lto = "fat"
codegen-units = 1
# A GUI app has nothing to unwind into; aborting drops the unwind tables.
panic = "abort"
strip = true
